<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generate Reports - FreshFold Laundry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .user-info {
            display: flex;
            align-items: center;
        }
        .user-info span {
            margin-right: 15px;
        }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        .logout-btn i {
            margin-right: 5px;
        }
        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        .sidebar {
            width: 200px;
            background-color: #34495e;
            padding-top: 20px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-bottom: 1px solid #2c3e50;
            transition: background-color 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #2c3e50;
        }
        .sidebar a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .page-title {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .report-form {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .generate-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .generate-btn:hover {
            background-color: #2980b9;
        }
        .report-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .report-type-card {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .report-type-card:hover {
            border-color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .report-type-card.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }
        .report-type-icon {
            font-size: 36px;
            color: #3498db;
            margin-bottom: 10px;
        }
        .report-type-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .hidden {
            display: none;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>FreshFold-Laundry</h1>
    <div class="user-info">
        <span>Welcome, Admin</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </form>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <a href="/AdminDashboard">
            <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
        <a href="/admins">
            <i class="fas fa-user-shield"></i> Admin Management
        </a>
        <a href="/user-management">
            <i class="fas fa-users"></i> User Management
        </a>
        <a href="/order-management">
            <i class="fas fa-shopping-cart"></i> Order Management
        </a>
        <a href="/payment-management">
            <i class="fas fa-money-bill-wave"></i> Payment Management
        </a>
        <a href="/category-management">
            <i class="fas fa-tags"></i> Category Management
        </a>
        <a href="/feedback-management">
            <i class="fas fa-comments"></i> Feedback Management
        </a>
        <a href="/reports" class="active">
            <i class="fas fa-chart-bar"></i> Generate Reports
        </a>
    </div>

    <div class="content">
        <h2 class="page-title">Generate Reports</h2>

        <div class="alert alert-danger" th:if="${error}">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
        </div>

        <div class="report-form">
            <div class="report-types">
                <div class="report-type-card" onclick="selectReportType('sales')">
                    <div class="report-type-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="report-type-title">Sales Report</div>
                </div>
                <div class="report-type-card" onclick="selectReportType('customer')">
                    <div class="report-type-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="report-type-title">Customer Report</div>
                </div>
                <div class="report-type-card" onclick="selectReportType('order')">
                    <div class="report-type-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="report-type-title">Order Report</div>
                </div>
                <div class="report-type-card" onclick="selectReportType('payment')">
                    <div class="report-type-icon">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div class="report-type-title">Payment Report</div>
                </div>
            </div>

            <form th:action="@{/generate-report}" method="post">
                <input type="hidden" id="reportType" name="reportType" value="sales">

                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" name="endDate" required>
                    </div>
                </div>

                <button type="submit" class="generate-btn">Generate Report</button>
            </form>
        </div>
    </div>
</div>

<script>
    function selectReportType(type) {
        // Remove selected class from all cards
        document.querySelectorAll('.report-type-card').forEach(card => {
            card.classList.remove('selected');
        });

        // Add selected class to clicked card
        event.currentTarget.classList.add('selected');

        // Set the hidden input value
        document.getElementById('reportType').value = type;
    }
</script>
</body>
</html>
